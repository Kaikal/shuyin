# 安卓两个 APK（手机版 / 车机版）云打包。
#
# 产物：shuyin-phone-*.apk（cn.shuyin.player）+ shuyin-car-*.apk（cn.shuyin.player.car）
#
# 签名用的是 release 配置指向的 debug keystore（见 app/build.gradle 的注释：
# 交付用自签名，上架再换正式 keystore）。GitHub 的 runner 上不存在这个文件，
# 所以下面先用 keytool 按同样的 alias/口令生成一份——口令必须和 build.gradle
# 里写死的一致（android / androiddebugkey / android），否则签名阶段会报
# "Keystore was tampered with"。
name: Android build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-build.yml'
      - 'code/apps/android/**'
      - 'code/apps/desktop/src/**'
      - 'code/packages/**'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: code/pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # 安卓壳不跑 Tauri：前端产物直接落到 app/src/main/assets/www
      - name: Build web assets
        run: bash apps/android/build-web.sh

      # 不用 android-actions/setup-android：它内部会跑 `sdkmanager tools`，
      # 而 runner 的 SDK 里已经没有这个包了，直接 exit 1（第一次跑就挂在这）。
      # GitHub 的 ubuntu 镜像本来就预装了 Android SDK + cmdline-tools，
      # 这里只补 platform-34 就够（compileSdk / targetSdk 都是 34）。
      - name: Install SDK platform 34
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          echo "sdk = $SDK"
          SDKMGR=$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager = $SDKMGR"
          [ -x "$SDKMGR" ] || { echo "找不到 sdkmanager"; exit 1; }
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # 注意用 bash 调而不是 ./gradlew：仓库里 gradlew 的模式是 100644
      # （没有执行位，Windows 上 git 不会保留），直接 ./gradlew 会 Permission denied。
      - name: Build APKs
        working-directory: code/apps/android/android
        run: bash gradlew assemblePhoneRelease assembleCarRelease --no-daemon --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p apps/android/dist-android
          find apps/android/android/app/build/outputs/apk -name "*.apk" \
            -exec cp {} apps/android/dist-android/ \;
          # 按变体重命名，避免两个 apk 同名覆盖（Gradle 产物本身就叫 app-phone-release.apk）
          ls -lh apps/android/dist-android
          if [ -z "$(ls -A apps/android/dist-android)" ]; then echo "没有产出 apk"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: shuyin-android
          path: code/apps/android/dist-android/*
          if-no-files-found: error
