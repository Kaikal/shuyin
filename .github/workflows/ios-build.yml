# iOS 云编译（未签名 IPA）：GitHub 的 macOS 机器上出包，无需苹果开发者账号。
# 产物为「未签名 IPA」：用户用爱思助手 / Sideloadly / 轻松签 + 自己的 Apple ID
# 自签后安装（免费证书 7 天有效）。后续接入正式分发（TestFlight / App Store）
# 需要开发者账号 + 签名证书，届时在 secrets 里配置即可复用本流程。
#
# 流程说明：tauri ios build 会驱动 xcodebuild（项目里的 Run Script 阶段需要
# CLI 在场，直接裸调 xcodebuild 会报 cli-options-server.json 缺失）。
# 签名豁免从 `-- ` 之后的参数透传给 xcodebuild；导出 IPA 那一步没有证书
# 注定失败（|| true 兜底），.app 从 xcarchive 里捞出来手工打成未签名 IPA。
name: iOS build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-build.yml'
      - 'code/apps/desktop/src-tauri/**'
      - 'code/apps/desktop/src/**'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: code/pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'code/apps/desktop/src-tauri'

      - name: Generate app icons (before ios init so AppIcon set is included)
        run: pnpm -F shuyin-desktop tauri icon src-tauri/icons/1024x1024.png

      - name: Generate iOS project (tauri ios init)
        run: pnpm -F shuyin-desktop tauri ios init --ci

      - name: Patch Info.plist (中文名 / 状态栏 / 后台音频)
        run: |
          PLIST=$(find apps/desktop/src-tauri/gen/apple -name "Info.plist" -not -path "*/Frameworks/*" | head -1)
          echo "plist: $PLIST"
          python3 - "$PLIST" <<'EOF'
          import plistlib, sys
          p = sys.argv[1]
          d = plistlib.load(open(p, 'rb'))
          # 桌面/安卓那边的应用名是中文（tl.title=疏音），iOS 只认 Info.plist：
          # 不写 CFBundleDisplayName 就退回 CFBundleName=Shuyin，桌面上显示成英文
          d['CFBundleDisplayName'] = '疏音'
          d['CFBundleName'] = '疏音'
          # 开发区域跟着改：否则系统弹窗（权限、分享）按英文出
          d['CFBundleDevelopmentRegion'] = 'zh_CN'
          d['CFBundleLocalizations'] = ['zh-Hans', 'en']
          # 页面是全屏深色，状态栏必须用浅色字，否则黑字压黑底看不见
          d['UIViewControllerBasedStatusBarAppearance'] = False
          d['UIStatusBarStyle'] = 'UIStatusBarStyleLightContent'
          modes = d.get('UIBackgroundModes') or []
          if 'audio' not in modes:
              modes.append('audio')
          d['UIBackgroundModes'] = modes
          plistlib.dump(d, open(p, 'wb'))
          print('displayName =', d['CFBundleDisplayName'], '| region =', d['CFBundleDevelopmentRegion'])
          EOF

      - name: Force our app icon into the iOS project
        run: |
          ROOT=apps/desktop/src-tauri/gen/apple
          SRC=apps/desktop/src-tauri/icons/1024x1024.png
          echo "icon source: $(ls -l "$SRC")"
          echo "--- 现有 AppIcon 资源（处理前）"
          find "$ROOT" -name "AppIcon*.png" | head -30
          find "$ROOT" -type d -name "AppIcon.appiconset"
          python3 - "$ROOT" "$SRC" <<'EOF'
          import json, os, re, subprocess, sys
          root, src = sys.argv[1], sys.argv[2]

          def resize(px, out):
              subprocess.run(['sips', '-z', str(px), str(px), src, '--out', out],
                             check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)

          done = 0
          # ① 资产目录：按 Contents.json 的 size x scale 把每张都换成我们的图
          for dirpath, _dirs, _files in os.walk(root):
              if not dirpath.endswith('.appiconset'):
                  continue
              cj = os.path.join(dirpath, 'Contents.json')
              if not os.path.exists(cj):
                  continue
              try:
                  c = json.load(open(cj, encoding='utf-8'))
              except Exception as e:
                  print('skip', cj, e)
                  continue
              for im in c.get('images', []):
                  fn = im.get('filename')
                  if not fn:
                      continue
                  try:
                      w = float(im.get('size', '0x0').split('x')[0])
                      s = float(im.get('scale', '1x').rstrip('x'))
                  except Exception:
                      continue
                  px = int(round(w * s))
                  if px > 0:
                      resize(px, os.path.join(dirpath, fn))
                      done += 1
          # ② 模板散在资源目录里的 AppIcon60x60@2x.png 这类：名字里带尺寸
          #    这类是 CFBundleIconFiles 的主路径（真机桌面用的就是它），
          #    iPhone 是 3x 屏，缺 @3x 就只能拿 @2x 拉伸，所以顺手补齐兄弟尺寸。
          pat = re.compile(r'^AppIcon(\d+)x(\d+)@(\d)x(.*)\.png$')
          for dirpath, _dirs, files in os.walk(root):
              if '.appiconset' in dirpath:
                  continue
              for fn in list(files):
                  m = pat.match(fn)
                  if not m:
                      continue
                  w, h, suffix = m.group(1), m.group(2), m.group(4)
                  for s in ('1', '2', '3'):
                      px_w = int(round(float(w) * int(s)))
                      if px_w > 1024:
                          continue
                      name = 'AppIcon' + w + 'x' + h + '@' + s + 'x' + suffix + '.png'
                      resize(px_w, os.path.join(dirpath, name))
                      done += 1
          print('已换成疏音图标的张数:', done)
          EOF
          echo "--- 处理后"
          find "$ROOT" -name "AppIcon*.png" -exec ls -l {} \; | head -30

      - name: Disable code signing in project
        run: |
          PBX=$(find apps/desktop/src-tauri/gen/apple -name "project.pbxproj" | head -1)
          echo "pbxproj: $PBX"
          python3 - "$PBX" <<'EOF'
          import sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          # 每个 buildSettings 段都注入免签设置：tauri CLI 透传的 xcodebuild
          # 参数到不了 archive 这步，只能改工程本体（不挑已有键的写法）
          inject = (
              "CODE_SIGN_IDENTITY = \"\";\n"
              "\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n"
              "\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n"
              "\t\t\t\tDEVELOPMENT_TEAM = \"\";\n"
              "\t\t\t\t"
          )
          s = s.replace("buildSettings = {", "buildSettings = {\n\t\t\t\t" + inject, )
          open(p, "w", encoding="utf-8").write(s)
          print("patched sections:", s.count("CODE_SIGNING_ALLOWED = NO;"))
          EOF

      - name: Build for device (unsigned; export step allowed to fail)
        run: |
          pnpm -F shuyin-desktop tauri ios build --ci --target aarch64 --export-method debugging || true

      - name: Verify app bundle (name / icon / status bar)
        run: |
          APP=$(find apps/desktop/src-tauri/gen/apple -name "*.app" -type d | head -1)
          echo "app: $APP"
          for k in CFBundleDisplayName CFBundleName CFBundleDevelopmentRegion UIStatusBarStyle CFBundleIcons; do
            printf "%s = " "$k"
            /usr/libexec/PlistBuddy -c "Print :$k" "$APP/Info.plist" 2>/dev/null || echo "(缺失)"
          done
          echo "--- 包内图标文件"
          ls -l "$APP"/AppIcon*.png 2>/dev/null || echo "(没有散图，图标走 Assets.car)"
          ls -l "$APP"/Assets.car 2>/dev/null || true

      - name: Package unsigned IPA
        run: |
          APP=$(find apps/desktop/src-tauri/gen/apple -name "*.app" -path "*Applications*" | head -1)
          if [ -z "$APP" ]; then
            APP=$(find apps/desktop/src-tauri/gen/apple -name "*.app" -type d | head -1)
          fi
          echo "app: $APP"
          if [ -z "$APP" ]; then echo "没有产出 .app（Rust 编译失败？看上面的日志）"; exit 1; fi
          rm -rf Payload shuyin-ios-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry shuyin-ios-unsigned.ipa Payload
          ls -la shuyin-ios-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: shuyin-ios-unsigned-ipa
          path: code/shuyin-ios-unsigned.ipa
          if-no-files-found: error
