# iOS 云编译（未签名 IPA）：GitHub 的 macOS 机器上出包，无需苹果开发者账号。
# 产物为「未签名 IPA」：用户用爱思助手 / Sideloadly / 轻松签 + 自己的 Apple ID
# 自签后安装（免费证书 7 天有效）。后续接入正式分发（TestFlight / App Store）
# 需要开发者账号 + 签名证书，届时在 secrets 里配置即可复用本流程。
#
# 流程说明：tauri ios build 会驱动 xcodebuild（项目里的 Run Script 阶段需要
# CLI 在场，直接裸调 xcodebuild 会报 cli-options-server.json 缺失）。
# 签名豁免从 `-- ` 之后的参数透传给 xcodebuild；导出 IPA 那一步没有证书
# 注定失败（|| true 兜底），.app 从 xcarchive 里捞出来手工打成未签名 IPA。
name: iOS build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-build.yml'
      - 'code/apps/desktop/src-tauri/**'
      - 'code/apps/desktop/src/**'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: code/pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'code/apps/desktop/src-tauri'

      - name: Generate app icons (before ios init so AppIcon set is included)
        run: pnpm -F shuyin-desktop tauri icon src-tauri/icons/1024x1024.png

      - name: Generate iOS project (tauri ios init)
        run: pnpm -F shuyin-desktop tauri ios init --ci

      - name: Install Live Activity Swift bridge into the iOS project
        run: |
          # 灵动岛的 Swift 桥接必须编进主 App 二进制（Rust 侧 dlsym 找
          # shuyin_live_sync 这些 @_cdecl 符号）。脚本兼容 Xcode 16 的
          # synchronized group 与传统 PBXGroup 两种工程格式。
          gem install xcodeproj --no-document >/dev/null 2>&1 || sudo gem install xcodeproj --no-document
          ruby apps/desktop/src-tauri/ios/install-swift.rb apps/desktop/src-tauri/gen/apple

      - name: Patch Info.plist (中文名 / 状态栏 / 后台音频 / 文件关联)
        run: |
          PLIST=$(find apps/desktop/src-tauri/gen/apple -name "Info.plist" -not -path "*/Frameworks/*" | head -1)
          echo "plist: $PLIST"
          python3 - "$PLIST" <<'EOF'
          import plistlib, sys
          p = sys.argv[1]
          d = plistlib.load(open(p, 'rb'))
          # 桌面/安卓那边的应用名是中文（tl.title=疏音），iOS 只认 Info.plist：
          # 不写 CFBundleDisplayName 就退回 CFBundleName=Shuyin，桌面上显示成英文
          d['CFBundleDisplayName'] = '疏音'
          d['CFBundleName'] = '疏音'
          # 开发区域跟着改：否则系统弹窗（权限、分享）按英文出
          d['CFBundleDevelopmentRegion'] = 'zh_CN'
          d['CFBundleLocalizations'] = ['zh-Hans', 'en']
          # 页面是全屏深色，状态栏必须用浅色字，否则黑字压黑底看不见
          d['UIViewControllerBasedStatusBarAppearance'] = False
          d['UIStatusBarStyle'] = 'UIStatusBarStyleLightContent'
          modes = d.get('UIBackgroundModes') or []
          if 'audio' not in modes:
              modes.append('audio')
          d['UIBackgroundModes'] = modes

          # ---- 文件关联：让疏音出现在「用其他 App 打开」列表里 ----
          # 洛雪的 .lxmc / 音源脚本 .js 都没有系统内置类型，不自己声明的话
          # 分享面板里根本没有疏音（用户原话：「iPhone 上音源选择打开方式也没有我们的 APP」）
          imported = d.get('UTImportedTypeDeclarations') or []
          have = {x.get('UTTypeIdentifier') for x in imported}
          for uti in [
              {
                  'UTTypeIdentifier': 'cn.shuyin.source-script',
                  'UTTypeDescription': '疏音音源脚本',
                  'UTTypeConformsTo': ['public.source-code'],
                  'UTTypeTagSpecification': {'public.filename-extension': ['js', 'mjs']},
              },
              {
                  'UTTypeIdentifier': 'cn.shuyin.lxmc',
                  'UTTypeDescription': '洛雪歌单',
                  'UTTypeConformsTo': ['public.data'],
                  'UTTypeTagSpecification': {'public.filename-extension': ['lxmc']},
              },
              {
                  'UTTypeIdentifier': 'cn.shuyin.playlist',
                  'UTTypeDescription': '歌单文件',
                  'UTTypeConformsTo': ['public.text'],
                  'UTTypeTagSpecification': {'public.filename-extension': ['m3u', 'm3u8', 'pls']},
              },
          ]:
              if uti['UTTypeIdentifier'] not in have:
                  imported.append(uti)
          d['UTImportedTypeDeclarations'] = imported
          # LSHandlerRank=Alternate：别去抢系统的默认打开方式，只在「其他应用」里出现
          d['CFBundleDocumentTypes'] = [
              {
                  'CFBundleTypeName': '音源脚本',
                  'CFBundleTypeRole': 'Editor',
                  'LSHandlerRank': 'Alternate',
                  'LSItemContentTypes': [
                      'cn.shuyin.source-script', 'public.source-code',
                      'com.netscape.javascript-source', 'public.plain-text',
                  ],
                  'CFBundleTypeExtensions': ['js', 'mjs'],
              },
              {
                  'CFBundleTypeName': '歌单',
                  'CFBundleTypeRole': 'Editor',
                  'LSHandlerRank': 'Alternate',
                  'LSItemContentTypes': ['cn.shuyin.lxmc', 'cn.shuyin.playlist', 'public.json'],
                  'CFBundleTypeExtensions': ['lxmc', 'm3u', 'm3u8', 'pls', 'json'],
              },
          ]
          # 实时活动（灵动岛 / 锁屏）：不写这个键，Activity.request 直接抛错，
          # 岛永远不出现——而且系统不给任何提示，纯靠这个键
          d['NSSupportsLiveActivities'] = True
          # ---- 自定义 scheme：让实时活动的 widgetURL 能把人带回 App ----
          # Live Activity 里的 `.widgetURL` 必须是一个**已注册**的 scheme，
          # 系统才会去打开宿主 App；没注册的表现就是「点了没反应」。
          url_types = d.get('CFBundleURLTypes') or []
          if not any('shuyin' in (x.get('CFBundleURLSchemes') or []) for x in url_types):
              url_types.append({
                  'CFBundleURLName': 'cn.shuyin.player',
                  'CFBundleURLSchemes': ['shuyin'],
              })
          d['CFBundleURLTypes'] = url_types

          # ---- ATS：WebView 里的 http 图片放行 ----
          # 洛雪导出的酷狗/酷我封面有一部分还是 http://。安卓 WebView 放行，
          # iOS 默认按 ATS 拦掉，表现是「别的图都正常，只有导入歌单的封面空白」。
          # 前端已经把 picUrl 升级成 https，这里兜住音源脚本自己返回的 http 图。
          ats = d.get('NSAppTransportSecurity') or {}
          ats['NSAllowsArbitraryLoadsInWebContent'] = True
          d['NSAppTransportSecurity'] = ats
          # 原地读取（不复制到临时目录）：文件本身走安全作用域，配合 Rust 侧
          # startAccessingSecurityScopedResource 读——大歌单复制一次太慢
          d['LSSupportsOpeningDocumentsInPlace'] = True
          # ---- 下载目录：让 App 的 Documents 在「文件」里可见 ----
          # iOS 没有公共「下载」文件夹，下载只能落沙箱里的 Documents。
          # 不写 UIFileSharingEnabled，那块目录在「文件」App 里根本不出现，
          # 用户下完歌以为没下下来（2026-11-23 反馈「找不到下载目录」）。
          # 两个键要一起：前者让 Documents 出现在「我的 iPhone」下，
          # 后者允许原地打开（编辑态），缺一个都不显示。
          d['UIFileSharingEnabled'] = True
          d['LSSupportsOpeningDocumentsInPlace'] = True
          plistlib.dump(d, open(p, 'wb'))
          print('displayName =', d['CFBundleDisplayName'], '| region =', d['CFBundleDevelopmentRegion'])
          print('docTypes =', [x['CFBundleTypeName'] for x in d['CFBundleDocumentTypes']])
          EOF

      - name: Inspect AppDelegate (确认 tao 是否接管 openURL)
        run: |
          AD=$(find apps/desktop/src-tauri/gen/apple -name "AppDelegate.swift" -not -path "*/Frameworks/*" | head -1)
          echo "AppDelegate: $AD"
          if [ -z "$AD" ]; then echo "没找到 AppDelegate.swift"; exit 0; fi
          echo "--- 全文"
          cat "$AD"
          echo "--- 是否已有 openURL 处理（tao 会自己接管，有就不需要我们补）"
          grep -n "open url\|openURL\|OpenURL" "$AD" || echo "(AppDelegate 里没有，交给 tao 的 Event::Opened)"

      - name: Force our app icon into the iOS project
        run: |
          ROOT=apps/desktop/src-tauri/gen/apple
          SRC=apps/desktop/src-tauri/icons/1024x1024.png
          echo "icon source: $(ls -l "$SRC")"
          echo "--- 现有 AppIcon 资源（处理前）"
          find "$ROOT" -name "AppIcon*.png" | head -30
          find "$ROOT" -type d -name "AppIcon.appiconset"
          python3 - "$ROOT" "$SRC" <<'EOF'
          import json, os, re, subprocess, sys
          root, src = sys.argv[1], sys.argv[2]

          def resize(px, out):
              subprocess.run(['sips', '-z', str(px), str(px), src, '--out', out],
                             check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)

          done = 0
          # ① 资产目录：按 Contents.json 的 size x scale 把每张都换成我们的图
          for dirpath, _dirs, _files in os.walk(root):
              if not dirpath.endswith('.appiconset'):
                  continue
              cj = os.path.join(dirpath, 'Contents.json')
              if not os.path.exists(cj):
                  continue
              try:
                  c = json.load(open(cj, encoding='utf-8'))
              except Exception as e:
                  print('skip', cj, e)
                  continue
              for im in c.get('images', []):
                  fn = im.get('filename')
                  if not fn:
                      continue
                  try:
                      w = float(im.get('size', '0x0').split('x')[0])
                      s = float(im.get('scale', '1x').rstrip('x'))
                  except Exception:
                      continue
                  px = int(round(w * s))
                  if px > 0:
                      resize(px, os.path.join(dirpath, fn))
                      done += 1
          # ② 模板散在资源目录里的 AppIcon60x60@2x.png 这类：名字里带尺寸
          #    这类是 CFBundleIconFiles 的主路径（真机桌面用的就是它），
          #    iPhone 是 3x 屏，缺 @3x 就只能拿 @2x 拉伸，所以顺手补齐兄弟尺寸。
          pat = re.compile(r'^AppIcon(\d+)x(\d+)@(\d)x(.*)\.png$')
          for dirpath, _dirs, files in os.walk(root):
              if '.appiconset' in dirpath:
                  continue
              for fn in list(files):
                  m = pat.match(fn)
                  if not m:
                      continue
                  w, h, suffix = m.group(1), m.group(2), m.group(4)
                  for s in ('1', '2', '3'):
                      px_w = int(round(float(w) * int(s)))
                      if px_w > 1024:
                          continue
                      name = 'AppIcon' + w + 'x' + h + '@' + s + 'x' + suffix + '.png'
                      resize(px_w, os.path.join(dirpath, name))
                      done += 1
          print('已换成疏音图标的张数:', done)
          EOF
          echo "--- 处理后"
          find "$ROOT" -name "AppIcon*.png" -exec ls -l {} \; | head -30

      - name: Disable code signing in project
        run: |
          PBX=$(find apps/desktop/src-tauri/gen/apple -name "project.pbxproj" | head -1)
          echo "pbxproj: $PBX"
          python3 - "$PBX" <<'EOF'
          import sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          # 每个 buildSettings 段都注入免签设置：tauri CLI 透传的 xcodebuild
          # 参数到不了 archive 这步，只能改工程本体（不挑已有键的写法）
          inject = (
              "CODE_SIGN_IDENTITY = \"\";\n"
              "\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n"
              "\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n"
              "\t\t\t\tDEVELOPMENT_TEAM = \"\";\n"
              "\t\t\t\t"
          )
          s = s.replace("buildSettings = {", "buildSettings = {\n\t\t\t\t" + inject, )
          open(p, "w", encoding="utf-8").write(s)
          print("patched sections:", s.count("CODE_SIGNING_ALLOWED = NO;"))
          EOF

      - name: Build for device (unsigned; export step allowed to fail)
        run: |
          pnpm -F shuyin-desktop tauri ios build --ci --target aarch64 --export-method debugging || true

      - name: Build Live Activity widget extension and embed
        run: |
          APP=$(find apps/desktop/src-tauri/gen/apple -name "*.app" -type d -path "*Applications*" | head -1)
          if [ -z "$APP" ]; then
            APP=$(find apps/desktop/src-tauri/gen/apple -name "*.app" -type d | head -1)
          fi
          echo "app: $APP"
          if [ -z "$APP" ]; then echo "主包没出来，扩展无从谈起"; exit 1; fi

          # 版本号必须与宿主一致，否则安装时被系统拒（extension version mismatch）
          MV=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          BV=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")
          echo "host version: $MV ($BV)"

          brew install xcodegen >/dev/null 2>&1 || true
          which xcodegen || { echo "xcodegen 装不上"; exit 1; }

          WIDGET=apps/desktop/src-tauri/ios/widget
          ( cd "$WIDGET" && xcodegen generate --quiet )
          xcodebuild -project "$WIDGET/ShuyinWidget.xcodeproj" \
                     -target ShuyinWidget \
                     -sdk iphoneos \
                     -configuration Release \
                     -arch arm64 \
                     MARKETING_VERSION="$MV" \
                     CURRENT_PROJECT_VERSION="$BV" \
                     CONFIGURATION_BUILD_DIR="$PWD/$WIDGET/build" \
                     build 2>&1 | tail -40

          APPEX=$(find "$WIDGET/build" -maxdepth 2 -name "*.appex" -type d | head -1)
          echo "appex: $APPEX"
          if [ -z "$APPEX" ]; then echo "扩展没编出来（看上面的 xcodebuild 日志）"; exit 1; fi

          # PlugIns/ 是 Xcode 认可的扩展存放位置。未签名 IPA 直接拷进去即可，
          # Sideloadly / 爱思重签时会连扩展一起签。
          mkdir -p "$APP/PlugIns"
          rm -rf "$APP/PlugIns/ShuyinWidget.appex"
          cp -R "$APPEX" "$APP/PlugIns/"
          echo "--- PlugIns"
          ls -la "$APP/PlugIns"
          /usr/libexec/PlistBuddy -c "Print :NSExtension" "$APP/PlugIns/ShuyinWidget.appex/Info.plist"

      - name: Verify app bundle (name / icon / status bar)
        run: |
          APP=$(find apps/desktop/src-tauri/gen/apple -name "*.app" -type d | head -1)
          echo "app: $APP"
          for k in CFBundleDisplayName CFBundleName CFBundleDevelopmentRegion UIStatusBarStyle CFBundleIcons; do
            printf "%s = " "$k"
            /usr/libexec/PlistBuddy -c "Print :$k" "$APP/Info.plist" 2>/dev/null || echo "(缺失)"
          done
          echo "--- 包内图标文件"
          ls -l "$APP"/AppIcon*.png 2>/dev/null || echo "(没有散图，图标走 Assets.car)"
          ls -l "$APP"/Assets.car 2>/dev/null || true
          echo "--- 文件关联（决定「用疏音打开」里有没有我们）"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDocumentTypes" "$APP/Info.plist" 2>/dev/null || echo "(没有 CFBundleDocumentTypes)"
          for k in LSSupportsOpeningDocumentsInPlace UTImportedTypeDeclarations NSSupportsLiveActivities; do
            printf "%s = " "$k"
            /usr/libexec/PlistBuddy -c "Print :$k" "$APP/Info.plist" 2>/dev/null | head -3 || echo "(缺失)"
          done
          echo "--- 灵动岛扩展（没有它 = 岛上什么都看不到）"
          ls -la "$APP/PlugIns" 2>/dev/null || echo "(没有 PlugIns 目录)"
          for f in "$APP"/PlugIns/*.appex/ShuyinWidget; do
            [ -f "$f" ] && echo "可执行文件: $f ($(ls -l "$f" | awk '{print $5}') bytes)"
          done

      - name: Package unsigned IPA
        run: |
          APP=$(find apps/desktop/src-tauri/gen/apple -name "*.app" -path "*Applications*" | head -1)
          if [ -z "$APP" ]; then
            APP=$(find apps/desktop/src-tauri/gen/apple -name "*.app" -type d | head -1)
          fi
          echo "app: $APP"
          if [ -z "$APP" ]; then echo "没有产出 .app（Rust 编译失败？看上面的日志）"; exit 1; fi
          rm -rf Payload shuyin-ios-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry shuyin-ios-unsigned.ipa Payload
          ls -la shuyin-ios-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: shuyin-ios-unsigned-ipa
          path: code/shuyin-ios-unsigned.ipa
          if-no-files-found: error
