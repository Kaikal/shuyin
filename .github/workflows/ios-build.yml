# iOS 云编译（未签名 IPA）：GitHub 的 macOS 机器上出包，无需苹果开发者账号。
# 产物为「未签名 IPA」：用户用爱思助手 / Sideloadly / 轻松签 + 自己的 Apple ID
# 自签后安装（免费证书 7 天有效）。后续接入正式分发（TestFlight / App Store）
# 需要开发者账号 + 签名证书，届时在 secrets 里配置即可复用本流程。
#
# 流程说明：tauri ios build 会驱动 xcodebuild（项目里的 Run Script 阶段需要
# CLI 在场，直接裸调 xcodebuild 会报 cli-options-server.json 缺失）。
# 签名豁免从 `-- ` 之后的参数透传给 xcodebuild；导出 IPA 那一步没有证书
# 注定失败（|| true 兜底），.app 从 xcarchive 里捞出来手工打成未签名 IPA。
name: iOS build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-build.yml'
      - 'code/apps/desktop/src-tauri/**'
      - 'code/apps/desktop/src/**'
      # 平台脚本（取链/歌单/歌词都在这）打进 iOS 包，改了也要重出包，
      # 否则会出现「修了 packages 却只有安卓/桌面端生效」的错位（2026-11-26 踩过）。
      - 'code/packages/**'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: code/pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'code/apps/desktop/src-tauri'

      - name: Generate app icons (before ios init so AppIcon set is included)
        run: pnpm -F shuyin-desktop tauri icon src-tauri/icons/1024x1024.png

      - name: Generate iOS project (tauri ios init)
        run: pnpm -F shuyin-desktop tauri ios init --ci

      - name: Install Live Activity Swift bridge into the iOS project
        run: |
          # 灵动岛的 Swift 桥接必须编进主 App 二进制（Rust 侧 dlsym 找
          # shuyin_live_sync 这些 @_cdecl 符号）。脚本兼容 Xcode 16 的
          # synchronized group 与传统 PBXGroup 两种工程格式。
          gem install xcodeproj --no-document >/dev/null 2>&1 || sudo gem install xcodeproj --no-document
          ruby apps/desktop/src-tauri/ios/install-swift.rb apps/desktop/src-tauri/gen/apple

      - name: Patch Info.plist (中文名 / 状态栏 / 后台音频 / 文件关联)
        run: |
          # 打**每一个** Info.plist，不再 `head -1` 猜一个。
          #
          # 之前只挑第一个，一旦 gen 目录里出现第二份 plist（不同 target 的
          # 宿主目录、或模板结构变化），改到的就可能不是 app target 的那份：
          # 构建照常成功、包照常能装，只有「灵动岛点了没反应」这一个症状
          # （shuyin:// 没注册，Live Activity 的 Link 会被系统整个吞掉）。
          PLISTS=$(find apps/desktop/src-tauri/gen/apple -name "Info.plist" -not -path "*/Frameworks/*")
          echo "plists:"; echo "$PLISTS"
          for PLIST in $PLISTS; do
          echo "== patch $PLIST"
          python3 - "$PLIST" <<'EOF'
          import plistlib, sys
          p = sys.argv[1]
          d = plistlib.load(open(p, 'rb'))
          # 桌面/安卓那边的应用名是中文（tl.title=疏音），iOS 只认 Info.plist：
          # 不写 CFBundleDisplayName 就退回 CFBundleName=Shuyin，桌面上显示成英文
          d['CFBundleDisplayName'] = '疏音'
          d['CFBundleName'] = '疏音'
          # 开发区域跟着改：否则系统弹窗（权限、分享）按英文出
          d['CFBundleDevelopmentRegion'] = 'zh_CN'
          d['CFBundleLocalizations'] = ['zh-Hans', 'en']
          # 页面是全屏深色，状态栏必须用浅色字，否则黑字压黑底看不见
          d['UIViewControllerBasedStatusBarAppearance'] = False
          d['UIStatusBarStyle'] = 'UIStatusBarStyleLightContent'
          modes = d.get('UIBackgroundModes') or []
          if 'audio' not in modes:
              modes.append('audio')
          d['UIBackgroundModes'] = modes

          # ---- 文件关联：让疏音出现在「用其他 App 打开」列表里 ----
          # 洛雪的 .lxmc / 音源脚本 .js 都没有系统内置类型，不自己声明的话
          # 分享面板里根本没有疏音（用户原话：「iPhone 上音源选择打开方式也没有我们的 APP」）
          imported = d.get('UTImportedTypeDeclarations') or []
          have = {x.get('UTTypeIdentifier') for x in imported}
          for uti in [
              {
                  'UTTypeIdentifier': 'cn.shuyin.source-script',
                  'UTTypeDescription': '疏音音源脚本',
                  'UTTypeConformsTo': ['public.source-code'],
                  'UTTypeTagSpecification': {'public.filename-extension': ['js', 'mjs']},
              },
              {
                  'UTTypeIdentifier': 'cn.shuyin.lxmc',
                  'UTTypeDescription': '洛雪歌单',
                  'UTTypeConformsTo': ['public.data'],
                  'UTTypeTagSpecification': {'public.filename-extension': ['lxmc']},
              },
              {
                  'UTTypeIdentifier': 'cn.shuyin.playlist',
                  'UTTypeDescription': '歌单文件',
                  'UTTypeConformsTo': ['public.text'],
                  'UTTypeTagSpecification': {'public.filename-extension': ['m3u', 'm3u8', 'pls']},
              },
          ]:
              if uti['UTTypeIdentifier'] not in have:
                  imported.append(uti)
          d['UTImportedTypeDeclarations'] = imported
          # LSHandlerRank=Alternate：别去抢系统的默认打开方式，只在「其他应用」里出现
          d['CFBundleDocumentTypes'] = [
              {
                  'CFBundleTypeName': '音源脚本',
                  'CFBundleTypeRole': 'Editor',
                  'LSHandlerRank': 'Alternate',
                  'LSItemContentTypes': [
                      'cn.shuyin.source-script', 'public.source-code',
                      'com.netscape.javascript-source', 'public.plain-text',
                  ],
                  'CFBundleTypeExtensions': ['js', 'mjs'],
              },
              {
                  'CFBundleTypeName': '歌单',
                  'CFBundleTypeRole': 'Editor',
                  'LSHandlerRank': 'Alternate',
                  'LSItemContentTypes': ['cn.shuyin.lxmc', 'cn.shuyin.playlist', 'public.json'],
                  'CFBundleTypeExtensions': ['lxmc', 'm3u', 'm3u8', 'pls', 'json'],
              },
          ]
          # 实时活动（灵动岛 / 锁屏）：不写这个键，Activity.request 直接抛错，
          # 岛永远不出现——而且系统不给任何提示，纯靠这个键
          d['NSSupportsLiveActivities'] = True
          # 高频更新。不写这个键，系统按「低频」额度限流：播放/暂停、换歌、
          # 歌词这些推送会被静静丢掉——表现就是「岛上的播放键一直不动」
          # 「倒计时走完了歌还在播」（2026-11-24 反馈），而 App 里一切正常。
          d['NSSupportsLiveActivitiesFrequentUpdates'] = True
          # ---- 自定义 scheme：让实时活动的 widgetURL 能把人带回 App ----
          # Live Activity 里的 `.widgetURL` 必须是一个**已注册**的 scheme，
          # 系统才会去打开宿主 App；没注册的表现就是「点了没反应」。
          url_types = d.get('CFBundleURLTypes') or []
          if not any('shuyin' in (x.get('CFBundleURLSchemes') or []) for x in url_types):
              url_types.append({
                  'CFBundleURLName': 'cn.shuyin.player',
                  'CFBundleURLSchemes': ['shuyin'],
              })
          d['CFBundleURLTypes'] = url_types

          # ---- ATS：WebView 里的 http 图片放行 ----
          # 洛雪导出的酷狗/酷我封面有一部分还是 http://。安卓 WebView 放行，
          # iOS 默认按 ATS 拦掉，表现是「别的图都正常，只有导入歌单的封面空白」。
          # 前端已经把 picUrl 升级成 https，这里兜住音源脚本自己返回的 http 图。
          ats = d.get('NSAppTransportSecurity') or {}
          ats['NSAllowsArbitraryLoadsInWebContent'] = True
          d['NSAppTransportSecurity'] = ats
          # 原地读取（不复制到临时目录）：文件本身走安全作用域，配合 Rust 侧
          # startAccessingSecurityScopedResource 读——大歌单复制一次太慢
          d['LSSupportsOpeningDocumentsInPlace'] = True
          # ---- 下载目录：让 App 的 Documents 在「文件」里可见 ----
          # iOS 没有公共「下载」文件夹，下载只能落沙箱里的 Documents。
          # 不写 UIFileSharingEnabled，那块目录在「文件」App 里根本不出现，
          # 用户下完歌以为没下下来（2026-11-23 反馈「找不到下载目录」）。
          # 两个键要一起：前者让 Documents 出现在「我的 iPhone」下，
          # 后者允许原地打开（编辑态），缺一个都不显示。
          d['UIFileSharingEnabled'] = True
          d['LSSupportsOpeningDocumentsInPlace'] = True
          plistlib.dump(d, open(p, 'wb'))
          print('displayName =', d['CFBundleDisplayName'], '| region =', d['CFBundleDevelopmentRegion'])
          print('docTypes =', [x['CFBundleTypeName'] for x in d['CFBundleDocumentTypes']])
          print('urlSchemes =', [x.get('CFBundleURLSchemes') for x in d['CFBundleURLTypes']])
          EOF
          done

      - name: Inspect AppDelegate (确认 tao 是否接管 openURL)
        run: |
          AD=$(find apps/desktop/src-tauri/gen/apple -name "AppDelegate.swift" -not -path "*/Frameworks/*" | head -1)
          echo "AppDelegate: $AD"
          if [ -z "$AD" ]; then echo "没找到 AppDelegate.swift"; exit 0; fi
          echo "--- 全文"
          cat "$AD"
          echo "--- 是否已有 openURL 处理（tao 会自己接管，有就不需要我们补）"
          grep -n "open url\|openURL\|OpenURL" "$AD" || echo "(AppDelegate 里没有，交给 tao 的 Event::Opened)"

      - name: Force our app icon into the iOS project
        run: |
          ROOT=apps/desktop/src-tauri/gen/apple
          SRC=apps/desktop/src-tauri/icons/1024x1024.png
          echo "icon source: $(ls -l "$SRC")"
          echo "--- 现有 AppIcon 资源（处理前）"
          find "$ROOT" -name "AppIcon*.png" | head -30
          find "$ROOT" -type d -name "AppIcon.appiconset"
          python3 - "$ROOT" "$SRC" <<'EOF'
          import json, os, re, subprocess, sys
          root, src = sys.argv[1], sys.argv[2]

          def resize(px, out):
              subprocess.run(['sips', '-z', str(px), str(px), src, '--out', out],
                             check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)

          done = 0
          # ① 资产目录：按 Contents.json 的 size x scale 把每张都换成我们的图
          for dirpath, _dirs, _files in os.walk(root):
              if not dirpath.endswith('.appiconset'):
                  continue
              cj = os.path.join(dirpath, 'Contents.json')
              if not os.path.exists(cj):
                  continue
              try:
                  c = json.load(open(cj, encoding='utf-8'))
              except Exception as e:
                  print('skip', cj, e)
                  continue
              for im in c.get('images', []):
                  fn = im.get('filename')
                  if not fn:
                      continue
                  try:
                      w = float(im.get('size', '0x0').split('x')[0])
                      s = float(im.get('scale', '1x').rstrip('x'))
                  except Exception:
                      continue
                  px = int(round(w * s))
                  if px > 0:
                      resize(px, os.path.join(dirpath, fn))
                      done += 1
          # ② 模板散在资源目录里的 AppIcon60x60@2x.png 这类：名字里带尺寸
          #    这类是 CFBundleIconFiles 的主路径（真机桌面用的就是它），
          #    iPhone 是 3x 屏，缺 @3x 就只能拿 @2x 拉伸，所以顺手补齐兄弟尺寸。
          pat = re.compile(r'^AppIcon(\d+)x(\d+)@(\d)x(.*)\.png$')
          for dirpath, _dirs, files in os.walk(root):
              if '.appiconset' in dirpath:
                  continue
              for fn in list(files):
                  m = pat.match(fn)
                  if not m:
                      continue
                  w, h, suffix = m.group(1), m.group(2), m.group(4)
                  for s in ('1', '2', '3'):
                      px_w = int(round(float(w) * int(s)))
                      if px_w > 1024:
                          continue
                      name = 'AppIcon' + w + 'x' + h + '@' + s + 'x' + suffix + '.png'
                      resize(px_w, os.path.join(dirpath, name))
                      done += 1
          print('已换成疏音图标的张数:', done)
          EOF
          echo "--- 处理后"
          find "$ROOT" -name "AppIcon*.png" -exec ls -l {} \; | head -30

      - name: Disable code signing in project
        run: |
          PBX=$(find apps/desktop/src-tauri/gen/apple -name "project.pbxproj" | head -1)
          echo "pbxproj: $PBX"
          python3 - "$PBX" <<'EOF'
          import re, sys

          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()

          # 先清掉旧值：同一段里出现两次 `KEY = ...;` 谁在后面谁生效，重复注入会让
          # 我们的 NO 被后面的 YES 盖掉（2026-11-24 就这么白等了一轮）。
          for key in ("DEAD_CODE_STRIPPING", "STRIP_SWIFT_SYMBOLS",
                      "STRIP_INSTALLED_PRODUCT", "COPY_PHASE_STRIP"):
              s = re.sub(r'^\s*' + key + r'\s*=\s*\w+;\s*\n', '', s, flags=re.M)

          EXTRA = (
              '\n\t\t\t\tCODE_SIGN_IDENTITY = "";'
              "\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;"
              "\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;"
              '\n\t\t\t\tDEVELOPMENT_TEAM = "";'
              # Rust 侧全靠 dlsym 运行时找 Swift 的 @_cdecl 入口，没有任何静态引用
              # 链，Release 的 -dead_strip 会把整段 Swift object 剥掉
              "\n\t\t\t\tDEAD_CODE_STRIPPING = NO;"
              "\n\t\t\t\tSTRIP_SWIFT_SYMBOLS = NO;"
              # 真正把符号表清空的是安装期这条 strip：实测产物里只剩 11 个定义符号
              # （1263 个全是 imported），dlsym 因此恒 NULL
              "\n\t\t\t\tSTRIP_INSTALLED_PRODUCT = NO;"
              "\n\t\t\t\tCOPY_PHASE_STRIP = NO;"
          )

          def patch_body(body):
              # 关键：ld64 链接**可执行文件**时默认不导出全局符号（要 -export_dynamic
              # 或 -exported_symbol 才进符号表）。这条不给，前面几条关 strip 全白费。
              m = re.search(r'OTHER_LDFLAGS = \((.*?)\);', body, re.S)
              if m:
                  if "-export_dynamic" in m.group(1):
                      return body
                  inner = (m.group(1).rstrip()
                           + '\n\t\t\t\t\t"-Wl,-export_dynamic",\n\t\t\t\t')
                  return body[:m.start(1)] + inner + body[m.end(1):]
              m = re.search(r'OTHER_LDFLAGS = "([^"]*)";', body)
              if m:
                  if "-export_dynamic" in m.group(1):
                      return body
                  return (body[:m.start(1)] + m.group(1) + " -Wl,-export_dynamic"
                          + body[m.end(1):])
              # 工程里本来没有：从上一级继承（tauri 的 -lapp 等都在那儿），再叠我们的
              return ('\n\t\t\t\tOTHER_LDFLAGS = (\n'
                      '\t\t\t\t\t"$(inherited)",\n'
                      '\t\t\t\t\t"-Wl,-export_dynamic",\n'
                      '\t\t\t\t);') + body

          # 按花括号配对逐块定位 buildSettings = { ... }：整文件 replace 会误伤
          # 其它段（改错段的症状是「构建照常成功，只有灵动岛/桌面歌词哑」）
          blocks, i = [], 0
          while True:
              j = s.find("buildSettings = {", i)
              if j < 0:
                  break
              start = j + len("buildSettings = {")
              depth, k = 1, start
              while k < len(s) and depth:
                  if s[k] == '{':
                      depth += 1
                  elif s[k] == '}':
                      depth -= 1
                  k += 1
              blocks.append((start, k - 1))
              i = k

          for start, end in reversed(blocks):
              s = s[:start] + patch_body(EXTRA + s[start:end]) + s[end:]

          open(p, "w", encoding="utf-8").write(s)
          print("buildSettings 段:", len(blocks))
          print("CODE_SIGNING_ALLOWED = NO :", s.count("CODE_SIGNING_ALLOWED = NO;"))
          print("DEAD_CODE_STRIPPING = NO  :", s.count("DEAD_CODE_STRIPPING = NO;"))
          print("STRIP_INSTALLED_PRODUCT=NO:", s.count("STRIP_INSTALLED_PRODUCT = NO;"))
          print("export_dynamic            :", s.count("-Wl,-export_dynamic"))
          EOF

      - name: Build for device (unsigned; export step allowed to fail)
        run: |
          mkdir -p build-logs
          # rquickjs-sys 的 iOS 绑定要现场 bindgen（见 src-tauri/Cargo.toml 的
          # target.'cfg(target_os="ios")' 段）。给它指明 iOS SDK，否则 clang 按
          # 宿主 macOS 的 sysroot 解析 quickjs.h 里的 <stdint.h> 会找不到。
          if command -v xcrun >/dev/null 2>&1; then
            export BINDGEN_EXTRA_CLANG_ARGS="-isysroot $(xcrun --sdk iphoneos --show-sdk-path)"
            echo "BINDGEN_EXTRA_CLANG_ARGS=$BINDGEN_EXTRA_CLANG_ARGS"
          fi
          # Cargo.toml 的 [profile.release] 是 strip = true，会把 Rust 侧的
          # #[no_mangle] shuyin_remote_command 也从静态库里抹掉（Swift 用 dlsym
          # 找它，剥了不报错、只是恒 NULL）。iOS 单独降到 debuginfo：符号表留着，
          # 调试信息照去，包不会明显变大。
          export CARGO_PROFILE_RELEASE_STRIP=debuginfo
          echo "CARGO_PROFILE_RELEASE_STRIP=$CARGO_PROFILE_RELEASE_STRIP"
          # 这里以前是整条 `|| true`：Rust/archive 失败也被吞掉，错误只剩下一步
          # 的一句「主包没出来」，看起来像扩展的问题（2026-11-24 就这么被带偏的）。
          # 现在只放过「导出 IPA 需要证书」那一段，但**必须真的产出 .app**，
          # 并把错误原文写进 step summary + 日志 artifact。
          pnpm -F shuyin-desktop tauri ios build --ci --target aarch64 --export-method debugging \
            > build-logs/tauri-ios-build.log 2>&1 || true
          tail -60 build-logs/tauri-ios-build.log
          APP=$(find apps/desktop/src-tauri/gen/apple -name "*.app" -type d -path "*Applications*" | head -1)
          if [ -z "$APP" ]; then
            {
              echo "### iOS 构建失败：没有产出 .app"
              echo ""
              echo '```'
              grep -nE "error(\[[^]]+\])?:|error: |Undefined symbol|ld: |fatal error" build-logs/tauri-ios-build.log | head -40 || true
              echo '```'
              echo ""
              echo "<details><summary>完整日志尾部</summary>"
              echo ""
              echo '```'
              tail -150 build-logs/tauri-ios-build.log
              echo '```'
              echo ""
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
            # 注解区是唯一能在 run 页面（不下载 artifact）直接看到的东西。
            # 取**日志尾部**：tauri 把 xcodebuild 的包装摘要打在最后，而真正的
            # 编译器错误在它前面几十行；head 只会抓到那些没用的摘要行。
            # 只要 rustc / swiftc 的**源码定位行**：`error[E0308]: ...` 与
            # `--> src/xxx.rs:12:5`。宽匹配会把尾部那串 tauri 包装摘要
            # （failed to build iOS app / ARCHIVE FAILED）全捞进来，反而把
            # 真正的错误挤掉。
            grep -nE "error\[E[0-9]+\]|--> *src/|no method named|cannot find |mismatched types" \
              build-logs/tauri-ios-build.log | tail -8 \
              | while IFS= read -r l; do echo "::error::$(printf '%s' "$l" | cut -c1-1200)"; done || true
            # Rust 编译错误在后面，Swift 的在 xcodebuild 段：两段都扫一遍
            grep -nE "\.swift:[0-9]+:[0-9]+: error:" \
              build-logs/tauri-ios-build.log | tail -6 \
              | while IFS= read -r l; do echo "::error::$(printf '%s' "$l" | cut -c1-1200)"; done || true
            echo "主包没出来（错误已写进 step summary 与 build-logs 日志）"
            exit 1
          fi
          echo "app: $APP"

      - name: Verify bridge symbols survive into the binary
        run: |
          # 这一步是**必须**的：这几个符号没有任何静态引用链，全靠链接参数活着。
          # 少了它们构建一样成功、包一样能装、App 一切正常，只有灵动岛按钮和
          # 桌面歌词开关静默失效（dlsym 返回 NULL）。发出去才发现 = 又白一轮。
          APP=$(find apps/desktop/src-tauri/gen/apple -name "*.app" -path "*Applications*" | head -1)
          if [ -z "$APP" ]; then
            APP=$(find apps/desktop/src-tauri/gen/apple -name "*.app" -type d | head -1)
          fi
          EXE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")
          BIN="$APP/$EXE"
          echo "bin: $BIN"
          echo "--- 定义符号总数（正常上万；只剩几十个 = 又被 strip 掉了）"
          nm -gU "$BIN" 2>/dev/null | wc -l
          echo "--- 桥接符号"
          nm -gU "$BIN" 2>/dev/null | grep -E "_shuyin_" || echo "(一个都没有)"
          MISSING=""
          for s in shuyin_live_sync shuyin_live_end shuyin_live_adopt \
                   shuyin_pip_adopt shuyin_pip_set shuyin_pip_toggle shuyin_pip_on \
                   shuyin_remote_command; do
            if nm -gU "$BIN" 2>/dev/null | grep -qE "[[:space:]]_${s}$"; then
              echo "OK   $s"
            else
              echo "MISS $s"
              MISSING="$MISSING $s"
            fi
          done
          if [ -n "$MISSING" ]; then
            {
              echo "### ❌ 原生桥接符号没进二进制：$MISSING"
              echo ""
              echo '这些入口只有 Rust 的 `dlsym` 用，链接器看不到引用就不会导出；'
              echo '结果就是灵动岛按钮、桌面歌词开关**全部静默失效**（日志里'
              echo '`pip dlsym toggle: symbol NULL`），而 App 其它功能完全正常。'
              echo ""
              echo '对应开关：`OTHER_LDFLAGS += -Wl,-export_dynamic`、'
              echo '`STRIP_INSTALLED_PRODUCT = NO`、`DEAD_CODE_STRIPPING = NO`、'
              echo '`CARGO_PROFILE_RELEASE_STRIP=debuginfo`。'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::桥接符号缺失，这个包出去灵动岛和桌面歌词必然无效"
            exit 1
          fi
          echo "全部桥接符号都在。"

      - name: Build Live Activity widget extension and embed
        run: |
          APP=$(find apps/desktop/src-tauri/gen/apple -name "*.app" -type d -path "*Applications*" | head -1)
          if [ -z "$APP" ]; then
            APP=$(find apps/desktop/src-tauri/gen/apple -name "*.app" -type d | head -1)
          fi
          echo "app: $APP"
          if [ -z "$APP" ]; then echo "主包没出来，扩展无从谈起"; exit 1; fi

          # 版本号必须与宿主一致，否则安装时被系统拒（extension version mismatch）
          MV=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          BV=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")
          echo "host version: $MV ($BV)"

          brew install xcodegen >/dev/null 2>&1 || true
          which xcodegen || { echo "xcodegen 装不上"; exit 1; }

          WIDGET=apps/desktop/src-tauri/ios/widget
          ( cd "$WIDGET" && xcodegen generate --quiet )
          mkdir -p build-logs
          xcodebuild -project "$WIDGET/ShuyinWidget.xcodeproj" \
                     -target ShuyinWidget \
                     -sdk iphoneos \
                     -configuration Release \
                     -arch arm64 \
                     MARKETING_VERSION="$MV" \
                     CURRENT_PROJECT_VERSION="$BV" \
                     CONFIGURATION_BUILD_DIR="$PWD/$WIDGET/build" \
                     build > build-logs/widget-build.log 2>&1 || true
          tail -40 build-logs/widget-build.log

          APPEX=$(find "$WIDGET/build" -maxdepth 2 -name "*.appex" -type d | head -1)
          echo "appex: $APPEX"
          if [ -z "$APPEX" ]; then
            {
              echo "### 灵动岛扩展没编出来"
              echo ""
              echo '```'
              grep -nE "error:|Undefined symbol|ld: |fatal error" build-logs/widget-build.log | head -30 || true
              echo '```'
              echo ""
              echo "<details><summary>完整日志尾部</summary>"
              echo ""
              echo '```'
              tail -150 build-logs/widget-build.log
              echo '```'
              echo ""
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
            grep -nE "error:|Undefined symbol|ld: |fatal error" build-logs/widget-build.log \
              | head -12 | while IFS= read -r l; do echo "::error::$(printf '%s' "$l" | cut -c1-500)"; done || true
            echo "扩展没编出来（看上面的 xcodebuild 日志 / step summary）"
            exit 1
          fi

          # PlugIns/ 是 Xcode 认可的扩展存放位置。未签名 IPA 直接拷进去即可，
          # Sideloadly / 爱思重签时会连扩展一起签。
          mkdir -p "$APP/PlugIns"
          rm -rf "$APP/PlugIns/ShuyinWidget.appex"
          cp -R "$APPEX" "$APP/PlugIns/"
          echo "--- PlugIns"
          ls -la "$APP/PlugIns"
          /usr/libexec/PlistBuddy -c "Print :NSExtension" "$APP/PlugIns/ShuyinWidget.appex/Info.plist"

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          # 路径相对 workspace 根（upload-artifact 不认 defaults.run.working-directory）
          path: code/build-logs/**
          if-no-files-found: ignore

      - name: Verify app bundle (name / icon / status bar)
        run: |
          APP=$(find apps/desktop/src-tauri/gen/apple -name "*.app" -type d | head -1)
          echo "app: $APP"
          for k in CFBundleDisplayName CFBundleName CFBundleDevelopmentRegion UIStatusBarStyle CFBundleIcons; do
            printf "%s = " "$k"
            /usr/libexec/PlistBuddy -c "Print :$k" "$APP/Info.plist" 2>/dev/null || echo "(缺失)"
          done
          echo "--- 包内图标文件"
          ls -l "$APP"/AppIcon*.png 2>/dev/null || echo "(没有散图，图标走 Assets.car)"
          ls -l "$APP"/Assets.car 2>/dev/null || true
          echo "--- 文件关联（决定「用疏音打开」里有没有我们）"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDocumentTypes" "$APP/Info.plist" 2>/dev/null || echo "(没有 CFBundleDocumentTypes)"
          for k in LSSupportsOpeningDocumentsInPlace UTImportedTypeDeclarations NSSupportsLiveActivities NSSupportsLiveActivitiesFrequentUpdates; do
            printf "%s = " "$k"
            /usr/libexec/PlistBuddy -c "Print :$k" "$APP/Info.plist" 2>/dev/null | head -3 || echo "(缺失)"
          done
          echo "--- URL scheme（**灵动岛/锁屏卡点击的命门**）"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$APP/Info.plist" 2>/dev/null || true
          # 兜底：前面那步是「事后 patch 源 plist」，万一打在了别的文件上，
          # 构建照样成功、包照样能装，只有点灵动岛毫无反应（系统找不到 scheme
          # 时会把点击整个吞掉，连冷启动都不会发生）。这里直接改**产物**里的
          # Info.plist，IPA 是之后才压的，所以一定进包。幂等，已有就不动。
          python3 - "$APP/Info.plist" <<'PY'
          import plistlib, sys
          p = sys.argv[1]
          d = plistlib.load(open(p, 'rb'))
          types = d.get('CFBundleURLTypes') or []
          if not any('shuyin' in (x.get('CFBundleURLSchemes') or []) for x in types):
              types.append({'CFBundleURLName': 'cn.shuyin.player', 'CFBundleURLSchemes': ['shuyin']})
              d['CFBundleURLTypes'] = types
              plistlib.dump(d, open(p, 'wb'))
              print('产物里原本没有 → 已就地补上 shuyin')
          else:
              print('产物里已经有 shuyin，未改动')
          PY
          if ! python3 - "$APP/Info.plist" <<'PY'
          import plistlib, sys
          d = plistlib.load(open(sys.argv[1], 'rb'))
          ok = any('shuyin' in (x.get('CFBundleURLSchemes') or []) for x in (d.get('CFBundleURLTypes') or []))
          print('scheme ok' if ok else 'scheme MISSING')
          sys.exit(0 if ok else 1)
          PY
          then
            {
              echo "### ❌ 产物 Info.plist 里没有注册 shuyin scheme"
              echo ""
              echo "Live Activity 的 \`Link\` / \`widgetURL\` 指向 \`shuyin://live\`。"
              echo "这个 scheme 没进包 = 用户点灵动岛/锁屏卡时**系统整个吞掉点击**，"
              echo "不打开任何东西、连冷启动都没有（app.log 里 \`[scheme] canOpen\` 会是 false）。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "--- 灵动岛扩展（没有它 = 岛上什么都看不到）"
          ls -la "$APP/PlugIns" 2>/dev/null || echo "(没有 PlugIns 目录)"
          for f in "$APP"/PlugIns/*.appex/ShuyinWidget; do
            [ -f "$f" ] && echo "可执行文件: $f ($(ls -l "$f" | awk '{print $5}') bytes)"
          done

      - name: Package unsigned IPA
        run: |
          APP=$(find apps/desktop/src-tauri/gen/apple -name "*.app" -path "*Applications*" | head -1)
          if [ -z "$APP" ]; then
            APP=$(find apps/desktop/src-tauri/gen/apple -name "*.app" -type d | head -1)
          fi
          echo "app: $APP"
          if [ -z "$APP" ]; then echo "没有产出 .app（Rust 编译失败？看上面的日志）"; exit 1; fi
          rm -rf Payload shuyin-ios-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry shuyin-ios-unsigned.ipa Payload
          ls -la shuyin-ios-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: shuyin-ios-unsigned-ipa
          path: code/shuyin-ios-unsigned.ipa
          if-no-files-found: error
