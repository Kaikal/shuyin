# macOS 安装包（.dmg）云打包：在 GitHub 的 macOS 机器上出包，本机无需 Mac。
# 触发：手动（Actions 页面 Run workflow）或修改本文件推送时。
# 产物：未签名 dmg（用户首次打开需「右键 → 打开」绕过 Gatekeeper），挂在本次 run 的 Artifacts 里。
name: macOS build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/macos-build.yml'
      - 'code/apps/desktop/src-tauri/**'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: code/pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'code/apps/desktop/src-tauri'

      - name: Build app bundle (universal)
        run: pnpm -F shuyin-desktop tauri build --bundles app --target universal-apple-darwin

      - name: Patch Info.plist (文件关联：让「用疏音打开」里有我们)
        run: |
          APP=$(find apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name "*.app" | head -1)
          echo "app: $APP"
          if [ -z "$APP" ]; then echo "没有产出 .app"; exit 1; fi
          python3 - "$APP/Contents/Info.plist" <<'EOF'
          import plistlib, sys
          p = sys.argv[1]
          d = plistlib.load(open(p, 'rb'))
          # 洛雪的 .lxmc / 音源脚本 .js 都没有系统内置类型：不自己声明 UTI，
          # 访达的「打开方式」里根本不会出现疏音（用户实测反馈）
          imported = d.get('UTImportedTypeDeclarations') or []
          have = {x.get('UTTypeIdentifier') for x in imported}
          for uti in [
              {
                  'UTTypeIdentifier': 'cn.shuyin.source-script',
                  'UTTypeDescription': '疏音音源脚本',
                  'UTTypeConformsTo': ['public.source-code'],
                  'UTTypeTagSpecification': {'public.filename-extension': ['js', 'mjs']},
              },
              {
                  'UTTypeIdentifier': 'cn.shuyin.lxmc',
                  'UTTypeDescription': '洛雪歌单',
                  'UTTypeConformsTo': ['public.data'],
                  'UTTypeTagSpecification': {'public.filename-extension': ['lxmc']},
              },
              {
                  'UTTypeIdentifier': 'cn.shuyin.playlist',
                  'UTTypeDescription': '歌单文件',
                  'UTTypeConformsTo': ['public.text'],
                  'UTTypeTagSpecification': {'public.filename-extension': ['m3u', 'm3u8', 'pls']},
              },
          ]:
              if uti['UTTypeIdentifier'] not in have:
                  imported.append(uti)
          d['UTImportedTypeDeclarations'] = imported
          d['CFBundleDocumentTypes'] = [
              {
                  'CFBundleTypeName': '音源脚本',
                  'CFBundleTypeRole': 'Editor',
                  'LSHandlerRank': 'Alternate',
                  'LSItemContentTypes': [
                      'cn.shuyin.source-script', 'public.source-code',
                      'com.netscape.javascript-source', 'public.plain-text',
                  ],
                  'CFBundleTypeExtensions': ['js', 'mjs'],
              },
              {
                  'CFBundleTypeName': '歌单',
                  'CFBundleTypeRole': 'Editor',
                  'LSHandlerRank': 'Alternate',
                  'LSItemContentTypes': ['cn.shuyin.lxmc', 'cn.shuyin.playlist', 'public.json'],
                  'CFBundleTypeExtensions': ['lxmc', 'm3u', 'm3u8', 'pls', 'json'],
              },
          ]
          plistlib.dump(d, open(p, 'wb'))
          print('docTypes =', [x['CFBundleTypeName'] for x in d['CFBundleDocumentTypes']])
          EOF

      - name: Package dmg
        run: |
          APP=$(find apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name "*.app" | head -1)
          NAME=$(basename "$APP" .app)
          rm -rf stage "$NAME.dmg"
          mkdir -p stage
          cp -R "$APP" stage/
          ln -s /Applications stage/Applications
          hdiutil create -volname "$NAME" -srcfolder stage -ov -format UDZO "$NAME.dmg"
          ls -la "$NAME.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: shuyin-macos-dmg
          path: code/*.dmg
          if-no-files-found: error
