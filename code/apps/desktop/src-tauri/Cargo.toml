[package]
name = "shuyin-desktop"
version = "0.5.25"
license = "Apache-2.0"
description = "疏音 · 本地音乐播放器（桌面端）"
authors = ["shuyin"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "shuyin_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 托盘特性按平台拆（见文件末尾的 target 小节）：tray-icon 的底层实现没有 iOS 支持
tauri = { version = "2", features = ["protocol-asset"] }
# 无边框窗口取 HWND 用（Win11 圆角 / DWM 阴影）
raw-window-handle = "0.6"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# 国产 APP 导出的 txt 歌单多为 GBK：UTF-8 失败时回落 GB18030
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 日志按天分文件 / 只留 3 天 / 导出目录带时间戳（本地时区）
chrono = "0.4"

# 扫描：目录遍历 + 元数据
walkdir = "2"
lofty = "0.21"

# 数据库
rusqlite = { version = "0.32", features = ["bundled"] }

# 播放：原生解码与输出（不经 WebView <audio>）
# 0.21 起 Decoder::builder 支持带 byte_len 构造：symphonia 的 isomp4 初始化
# 必须知道流总长度，rodio 0.20 的包装层恒报 None，M4A/MP4 一律 panic（稻香翻车的根因）
rodio = "0.21.1"
# 频谱可视化：对解码后的采样做实时 FFT
rustfft = "6"
# rodio 内部已依赖 symphonia；这里只为启用全部格式 feature
symphonia = { version = "0.5", default-features = false, features = ["aac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
# opus 在 symphonia 0.5 中位于 opus-metadata / 依赖 ogg 容器（rodio 内部启用）

# 工具
sha2 = "0.10"
hex = "0.4"
rayon = "1.10"
# 封面图编解码（base64 与缩略图相关工具）
base64 = "0.22"
# 只开解码所需的那几种格式，不要默认的那一大堆（体积和编译时间都花在没用的地方）。
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

# 出网：平台 API 代理（绕 CORS）+ 在线曲目流式读取（HTTP Range）
# 用系统 TLS（Windows=schannel），不额外打包根证书
ureq = { version = "2", default-features = false, features = ["native-tls", "gzip"] }

# 音源脚本宿主（迁移到 Rust）：内嵌 QuickJS 跑洛雪音源脚本。
#
# 为什么必须内嵌：播放地址只能由「音源脚本」给出（平台层只负责搜索/歌词/评论），
# 而这些脚本现在跑在 WebView 的 Worker 里——iOS 切后台后 WebView 被系统挂起，
# 拿不到下一首的地址，表现就是「放完这首就停」。脚本在原生进程里跑，
# 后台接歌就不再依赖 WebView 是否活着。
rquickjs = "0.9"

# iOS 没有预生成的 bindings（rquickjs-sys 0.9 只带 darwin/linux/windows），
# 不现场 bindgen 会直接 include! 失败：
#   couldn't find file `.../bindings/aarch64-apple-ios.rs`
# **只在 iOS 目标下开这个 feature**：桌面开 bindgen 会要求本机装 libclang，
# 用户那台 Windows 上没有，会把本地 NSIS 打包搞坏。edition 2021 = resolver 2，
# feature 不跨 target 合并，所以桌面拿到的仍是预生成绑定。
[target.'cfg(target_os = "ios")'.dependencies]
rquickjs = { version = "0.9", features = ["bindgen"] }

# Windows 专属 API（注意：必须放在文件末尾——TOML 的 target 小节会吞掉
# 其后所有依赖，之前就是被吞导致 macOS 构建缺插件权限）
[target.'cfg(windows)'.dependencies]
# 全局快捷键 / 媒体键：只用 Win32 那几个消息与热键 API，不引第三方热键框架
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
# 系统媒体会话（SMTC）：耳机线控 / 蓝牙 AVRCP 按键走的就是它。
# 只用到 Media + Foundation，版本与 tauri 自己带的 windows 保持一致（0.62），
# 否则 HWND 这类类型在两边不是同一个，编译期就对不上。
windows = { version = "0.62", features = ["Foundation", "Media", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_RemoteDesktop"] }

# 托盘只在桌面端启用：底层 tray-icon crate 没有 iOS / Android 实现，
# 不拆开的话 iOS 构建直接链接失败
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }

# Apple 平台的原生调用（objc2 + block2）。
#   macOS：系统媒体会话（Now Playing / 耳机线控 / 控制中心）
#   iOS：  同一套媒体会话 + AVAudioSession（见 smtc.rs 的 apple 模块），
#          外加关掉 WKWebView 的双指缩放（见 lib.rs 的 disable_zoom）
# 故意不用生成的强类型 API：NSDictionary 的泛型值类型在 objc2 各版本间
# 反复变过，裸 msg_send 更抗版本漂移——
# 所以连 objc2-foundation 都不需要，NSString/NSNumber 全走 class! + msg_send
#
# block2 是 MPRemoteCommandCenter 的按键回调（addTargetWithHandler:）要用的，
# macOS / iOS 两端同一套。
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.6"
block2 = "0.6"

[profile.release]
# 保留 unwind：单个解码/元数据异常不应杀掉整个进程（声音线程内部另有 catch_unwind）
codegen-units = 1
lto = true
opt-level = "s"
strip = true
