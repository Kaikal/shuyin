/*
 * 疏音 · 安卓壳工程
 *
 * 只有 app 一个模块：界面全部由 Vite 打出来的 Web 前端提供（assets/www），
 * 原生侧只负责「平台能力」——媒体库扫描、播放与锁屏控制、出网、文件落盘。
 * 依赖刻意压到最低：不引 AndroidX / 不引 Material，全部用系统框架 API，
 * 这样构建不依赖外网仓库是否通、也不会被版本冲突拖住。
 */
pluginManagement {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        google()
        mavenCentral()
    }
}

rootProject.name = 'shuyin-android'
include ':app'
