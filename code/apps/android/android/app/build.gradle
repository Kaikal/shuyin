plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

/*
 * 两个「口味」= 两个 APK，同一个代码库：
 *   phone  给手机 / 平板          applicationId cn.shuyin.player
 *   car    给车机（横屏大屏）      applicationId cn.shuyin.player.car
 *
 * 两者可以同时安装在一台设备上（applicationId 不同），这正符合「车机版单独打包」。
 * 界面差异不靠两套前端，而是把 BuildConfig.CAR 传给前端，由 CSS/组件按 car 模式排布。
 */
android {
    namespace 'cn.shuyin.player'
    compileSdk 35

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 110
        versionName '0.6.109'
        resValue "string", "app_name", "疏音"
    }

    flavorDimensions "target"
    productFlavors {
        phone {
            dimension "target"
            applicationId 'cn.shuyin.player'
            resValue "string", "app_name", "疏音"
            buildConfigField "boolean", "CAR", "false"
        }
        car {
            dimension "target"
            applicationId 'cn.shuyin.player.car'
            resValue "string", "app_name", "疏音车机"
            buildConfigField "boolean", "CAR", "true"
        }
    }

    signingConfigs {
        // 交付用的自签名：debug 密钥即可安装。上架换成自己的 keystore 就行
        release {
            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
    }

    packagingOptions {
        resources.excludes += ['META-INF/*']
    }
}

/*
 * 前端产物由 apps/desktop 的 Vite 打到 app/src/main/assets/www，
 * 这里把「构建前必须先有 www/index.html」变成硬性检查：
 * 忘了跑前端构建时，报错要直说，而不是打出一个白屏 APK。
 */
tasks.register('checkWebAssets') {
    doFirst {
        def idx = file('src/main/assets/www/index.html')
        if (!idx.exists()) {
            throw new GradleException(
                "缺少前端产物：src/main/assets/www/index.html\n" +
                "先执行 apps/android/build-web.sh（或 npm run android:web）生成。")
        }
    }
}
tasks.named('preBuild') { dependsOn 'checkWebAssets' }

/*
 * 播放器：media3 ExoPlayer。
 *
 * 换掉系统 MediaPlayer 的唯一理由是**频谱**：MediaPlayer 只能通过
 * `android.media.audiofx.Visualizer` 拿输出音频，而那玩意要 RECORD_AUDIO
 * （用户不想给「一个音乐播放器要录音权限」）。ExoPlayer 的音频处理链允许插一个
 * 自定义 AudioProcessor，在 PCM 送去扬声器之前复制一份——不需要任何权限，
 * 而且拿到的是自己解码的原始数据，和播放进度严格同步（见 TapAudioProcessor.kt）。
 *
 * 只引 exoplayer 主包：MediaSession / UI 组件都用不上，通知和锁屏控制
 * 继续走现成的自研实现（PlaybackService 里的 MediaSession 是系统类，不是 media3 的）。
 */
dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    // 只为 FileProvider：装更新包必须给 content:// （Android 7 起 file:// 直接抛）。
    // media3 会带进来一个 androidx.core，但那是 runtime 依赖，编译期不保证可见。
    implementation 'androidx.core:core:1.13.0'
}
